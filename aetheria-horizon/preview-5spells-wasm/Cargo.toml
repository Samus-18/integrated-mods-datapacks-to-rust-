[package]
name = "aetheria-preview"
version = "0.8.4"
edition = "2024"
publish = false

[lib]
name = "aetheria_preview"
path = "src/lib.rs"

[dependencies]
aetheria-horizon-core = { path = ".." }
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }

[dev-dependencies]
# Match the Naga release pinned in the Horizon SDK revision to parse/validate
# the REAL guest material WGSL, not just verify the asset ZIP contains it.
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[package.metadata.horizon]
sdk = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"

[workspace]
