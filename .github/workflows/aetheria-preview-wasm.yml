name: Aetheria M38 real GPU Thorn Dart shader visual QA (internal)
concurrency:
  group: aetheria-wasm-internal-main
  cancel-in-progress: true
on:
  push:
    paths:
      - 'aetheria-horizon/preview-5spells-wasm/**'
      - 'aetheria-horizon/asset-pipeline/**'
      - '.github/workflows/aetheria-preview-wasm.yml'
  workflow_dispatch:
jobs:
  wasm-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aetheria-horizon/preview-5spells-wasm
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore pinned mod compiler cache
        id: cached-tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-horizon-mod
            ~/.cargo/registry
            ~/.cargo/git
          key: aetheria-horizon-mod-tool-0a875da-v1-linux
      - name: Install pinned Horizon mod tool if not cached
        if: steps.cached-tool.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev 0a875da91dbb0fdcb7ba8c42c11341aa229af51a cargo-horizon-mod
      - name: Prepare pinned free OGG encoder
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: aetheria-horizon/preview-5spells-wasm/tools/audio-requirements.txt
      - name: Install bundled FFmpeg wheel (no apt)
        run: python3 -m pip install --quiet --disable-pip-version-check -r tools/audio-requirements.txt
      - name: Generate original licensed-free spatial sound stems
        run: |
          python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())'
          python3 tools/generate_sound_assets.py
      - name: Verify original Blender outward face normals (no invisible mesh)
        run: python3 ../asset-pipeline/sharp-projectile-v2/validate_normals.py
      - name: Verify original Blender source geometry and active Rust dispatch
        run: python3 ../asset-pipeline/sharp-projectile-v2/validate_source.py
      - name: Verify 10-part sculpted Rime Bridge original Blender mesh and live dispatch
        run: python3 ../asset-pipeline/rime-bridge/validate_bridge.py
      - name: Compile prelinked WASM module and package
        run: cargo horizon-mod build --wasm
      - name: Test 200 cast intent identities, 170 draft solid VFX and 860 geometry viewpoints
        run: AETHERIA_VISUAL_AUDIT=1 cargo test --lib -- --nocapture
      - name: Validate WASM package and integrity
        run: |
          python3 - <<'PY'
          import zipfile, hashlib, tomllib, pathlib
          p=pathlib.Path('target/horizon-mod/aetheria_preview.hmod')
          assert p.is_file(), 'hmod missing'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert 'mod.wasm' in names
              assert 'horizon-mod.toml' in names
              assert 'Cargo.toml' in names
              assert 'assets/aetheria_preview/shaders/pipeline/ethereal.wgsl' in names
              assert 'assets/aetheria_preview/shaders/pipeline/soft_particle.wgsl' in names, 'M35 masked particle shader absent'
              m=tomllib.loads(z.read('horizon-mod.toml').decode())
              assert m['id']=='aetheria_preview'
              assert m['version']=='0.8.6'
              assert 'native' not in m and 'wasm' in m
              assert hashlib.sha512(z.read('mod.wasm')).hexdigest()==m['wasm']['sha512']
              wasm=z.read('mod.wasm')
              assert b'horizon_layout' in wasm and b'horizon_hook' in wasm, 'missing new Horizon ABI exports'
              assert b'horizon' in wasm and b'#' in wasm, 'missing name-linked Horizon API imports'
              cargo=tomllib.loads(z.read('Cargo.toml').decode())
              assert cargo['package']['metadata']['horizon']['sdk']=='0a875da91dbb0fdcb7ba8c42c11341aa229af51a', 'wrong Nightly SDK'
              ui=z.read('src/compact_ui.rs').decode()
              lib=z.read('src/lib.rs').decode()
              assert 'draw_constellation' not in ui, 'old massive menu still packaged'
              assert 'volumetric_forms::render(cast,age,scene)' in lib, 'M32 fallback missing'
              assert 'sharp_projectile::render(cast,age,scene)' in lib, 'M33 authored Frost Needle not wired'
              assert 'rime_bridge::render(cast,age,scene)' in lib, 'M34 authored Rime Bridge not wired'
              assert 'mod procedural_fx;' in lib and 'procedural_fx::render(cast,age,camera,&mut fx)' in lib, 'M35 live CPU emitter missing'
              assert 'aetheria_preview:soft_particle' in lib, 'M35 separate optional shader not registered'
              assert 'src/authored_100_data.rs' in names and 'src/authored_100_fx.rs' in names, '100 authored M36 sources not packed'
              assert 'src/signature_forms.rs' in names and 'src/signature_shader.rs' in names, 'M37 signature source missing'
              assert 'assets/aetheria_preview/shaders/pipeline/signature_sdf.wgsl' in names, 'M37 material not packaged'
              assert 'mod signature_shader;' in lib and 'aetheria_preview:signature_sdf' in lib, 'M37 optional shader not registered'
              assert 'signature_shader::render(cast,age,camera,&mut surface)' in lib, 'M37 GPU hero path not drawn'
              assert 'signature_forms::render(cast,age,scene)' in lib, 'M37 safe 3D fallback missing'
              assert 'mod authored_100_fx;' in lib and 'authored_100_fx::render(cast,age,camera,&mut fx)' in lib, 'M36 100-profile visual dispatcher not wired'
              assert 'src/rime_bridge_mesh_generated.rs' in names, 'original 436-quad Rime Bridge source missing'
              assert lib.count('KeyRegistration::new(')==1, 'old debug key mappings active'
              assert 'mod volumetric_forms;' in lib, 'M32 volume shader geometry missing'
              import json
              defs=json.loads(z.read('assets/aetheria_preview/sounds.json'))
              assert len(defs)==30, '30 original SFX not packaged'
              for event in defs:
                  path='assets/aetheria_preview/sounds/'+event+'.ogg'
                  assert path in names and len(z.read(path))>800
                  assert z.read(path)[:4]==b'OggS'
              print('PASS: wasm .hmod, SHA512, 30 original OGG SFX, shader, ZIP verified')
          PY
      - name: Prepare M31 playable test package
        run: |
          mkdir -p target/m31-gpu-test
          cp target/horizon-mod/aetheria_preview.hmod target/m31-gpu-test/
          cp TEST_M38.md target/m31-gpu-test/README-TEST.md
          python3 - <<'PY'
          import zipfile, pathlib, hashlib
          d=pathlib.Path('target/m31-gpu-test')
          assert set(x.name for x in d.iterdir()) == {'aetheria_preview.hmod','README-TEST.md'}
          with zipfile.ZipFile(d/'aetheria_preview.hmod') as z:
              assert z.testzip() is None
              shader=z.read('assets/aetheria_preview/shaders/pipeline/ethereal.wgsl')
              assert b'aetheria_integrate_haze' in shader
              assert b'for(var i=0u;i<10u;i=i+1u)' in shader
              assert b'aetheria_haze_density' in shader
          sha=hashlib.sha256((d/'aetheria_preview.hmod').read_bytes()).hexdigest()
          (d/'SHA256.txt').write_text(sha+'  aetheria_preview.hmod\n')
          print('M31 GPU haze test artifact ready; sha256:',sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Aetheria-Horizon-M38-INTERNAL-Thorn-Dart-Nightly-2026-11-20
          path: aetheria-horizon/preview-5spells-wasm/target/m31-gpu-test/

      - name: Upload geometry visual contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-M37-Visual-Audit-Internal
          path: aetheria-horizon/preview-5spells-wasm/target/visual-audit/
          if-no-files-found: warn
