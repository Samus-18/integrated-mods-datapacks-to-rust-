name: Aetheria M31 GPU volumetric shader test (200 visual drafts)
concurrency:
  group: aetheria-wasm-internal-main
  cancel-in-progress: true
on:
  push:
    paths:
      - 'aetheria-horizon/preview-5spells-wasm/**'
      - '.github/workflows/aetheria-preview-wasm.yml'
  workflow_dispatch:
jobs:
  wasm-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aetheria-horizon/preview-5spells-wasm
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore pinned mod compiler cache
        id: cached-tool
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-horizon-mod
            ~/.cargo/registry
            ~/.cargo/git
          key: aetheria-horizon-mod-tool-dd67b76-v1-linux
      - name: Install pinned Horizon mod tool if not cached
        if: steps.cached-tool.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev dd67b76ff23e28c6d8e21859df600d31572f81a0 cargo-horizon-mod
      - name: Prepare pinned free OGG encoder
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: aetheria-horizon/preview-5spells-wasm/tools/audio-requirements.txt
      - name: Install bundled FFmpeg wheel (no apt)
        run: python3 -m pip install --quiet --disable-pip-version-check -r tools/audio-requirements.txt
      - name: Generate original licensed-free spatial sound stems
        run: |
          python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())'
          python3 tools/generate_sound_assets.py
      - name: Compile prelinked WASM module and package
        run: cargo horizon-mod build --wasm
      - name: Test 200 cast intent identities, 170 draft solid VFX and 860 geometry viewpoints
        run: AETHERIA_VISUAL_AUDIT=1 cargo test --lib -- --nocapture
      - name: Validate WASM package and integrity
        run: |
          python3 - <<'PY'
          import zipfile, hashlib, tomllib, pathlib
          p=pathlib.Path('target/horizon-mod/aetheria_preview.hmod')
          assert p.is_file(), 'hmod missing'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert 'mod.wasm' in names
              assert 'horizon-mod.toml' in names
              assert 'Cargo.toml' in names
              assert 'assets/aetheria_preview/shaders/pipeline/ethereal.wgsl' in names
              m=tomllib.loads(z.read('horizon-mod.toml').decode())
              assert m['id']=='aetheria_preview'
              assert m['version']=='0.7.0'
              assert 'native' not in m and 'wasm' in m
              assert hashlib.sha512(z.read('mod.wasm')).hexdigest()==m['wasm']['sha512']
              import json
              defs=json.loads(z.read('assets/aetheria_preview/sounds.json'))
              assert len(defs)==30, '30 original SFX not packaged'
              for event in defs:
                  path='assets/aetheria_preview/sounds/'+event+'.ogg'
                  assert path in names and len(z.read(path))>800
                  assert z.read(path)[:4]==b'OggS'
              print('PASS: wasm .hmod, SHA512, 30 original OGG SFX, shader, ZIP verified')
          PY
      - name: Prepare M31 playable test package
        run: |
          mkdir -p target/m31-gpu-test
          cp target/horizon-mod/aetheria_preview.hmod target/m31-gpu-test/
          cp TEST_INSTRUCTIONS_M31.md target/m31-gpu-test/README-TEST.md
          python3 - <<'PY'
          import zipfile, pathlib, hashlib
          d=pathlib.Path('target/m31-gpu-test')
          assert set(x.name for x in d.iterdir()) == {'aetheria_preview.hmod','README-TEST.md'}
          with zipfile.ZipFile(d/'aetheria_preview.hmod') as z:
              assert z.testzip() is None
              shader=z.read('assets/aetheria_preview/shaders/pipeline/ethereal.wgsl')
              assert b'aetheria_integrate_haze' in shader
              assert b'for(var i=0u;i<10u;i=i+1u)' in shader
              assert b'aetheria_haze_density' in shader
          sha=hashlib.sha256((d/'aetheria_preview.hmod').read_bytes()).hexdigest()
          (d/'SHA256.txt').write_text(sha+'  aetheria_preview.hmod\n')
          print('M31 GPU haze test artifact ready; sha256:',sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Aetheria-Horizon-M31-GPU-Test-v0.7.0
          path: aetheria-horizon/preview-5spells-wasm/target/m31-gpu-test/

      - name: Upload geometry visual contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-M31-Visual-Audit-v0.7.0-Internal
          path: aetheria-horizon/preview-5spells-wasm/target/visual-audit/
          if-no-files-found: warn
