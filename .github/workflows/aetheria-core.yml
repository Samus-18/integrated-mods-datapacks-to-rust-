name: Aetheria Rust core
on:
  push:
    paths:
      - 'aetheria-horizon/**'
      - '.github/workflows/aetheria-core.yml'
  pull_request:
    paths:
      - 'aetheria-horizon/**'
      - '.github/workflows/aetheria-core.yml'
jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aetheria-horizon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and test actual M33 authored Frost Needle Rust geometry
        run: cargo test --manifest-path asset-pipeline/sharp-projectile-v2/rust-qa/Cargo.toml --all-targets
      - name: Check portable Rust core
        run: cargo test --all-targets
  rapier-physics-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aetheria-horizon/rapier-sim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify real Rapier3D fantasy debris and collision simulations
        run: cargo test --all-targets
