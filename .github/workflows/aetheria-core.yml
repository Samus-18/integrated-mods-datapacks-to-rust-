name: Aetheria Rust core
on:
  push:
    paths:
      - 'aetheria-horizon/**'
      - '.github/workflows/aetheria-core.yml'
  pull_request:
    paths:
      - 'aetheria-horizon/**'
      - '.github/workflows/aetheria-core.yml'
jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aetheria-horizon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check portable Rust core
        run: cargo test --all-targets
