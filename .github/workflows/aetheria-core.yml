name: Aetheria Rust core + M37 true shader signatures
on:
  push:
    paths:
      - 'aetheria-horizon/**'
      - '.github/workflows/aetheria-core.yml'
  pull_request:
    paths:
      - 'aetheria-horizon/**'
      - '.github/workflows/aetheria-core.yml'
jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aetheria-horizon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile exact M33/M34/M35 ice models and procedural particle Rust source
        run: cargo test --manifest-path asset-pipeline/sharp-projectile-v2/rust-qa/Cargo.toml --all-targets
      - name: Export actual M36 Rust-geometry art review panels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-M36-100-Spells-Source-Geometry-Review
          path: aetheria-horizon/asset-pipeline/sharp-projectile-v2/rust-qa/target/visual-m36/
          if-no-files-found: warn
      - name: Upload exact M37 name-specific 3D geometry source QA (NOT game screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aetheria-M37-11-Source-Silhouettes-Internal
          path: aetheria-horizon/asset-pipeline/sharp-projectile-v2/rust-qa/target/visual-m37/
          if-no-files-found: warn
      - name: Check portable Rust core
        run: cargo test --all-targets
  rapier-physics-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aetheria-horizon/rapier-sim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify real Rapier3D fantasy debris and collision simulations
        run: cargo test --all-targets
